<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Coffee Effect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>The Coffee Effect</h1>
        <p>The same three images can tell two different stories depending on their sequence.</p>
    </header>

  <main>
        <section id="controls">
            <h2>Choose a Story</h2>

            <button id="positive-button">Coffee Saves the Day</button>
            <button id="crash-button">The Caffeine Crash</button>
        </section>

        <section id="story">
            <h2 id="story-title">Coffee Saves the Day</h2>

            <p id="story-description">
                A tired student gets some coffee and finds the energy to finish their work.
            </p>
        </section>
